# Netlify build for GenCut for Creators (pnpm monorepo).
# Netlify UI → Project configuration → Build & deploy → Build settings:
#   Base directory:    (empty — repository root)
#   Package directory: apps/web
# Next.js is deployed by Netlify's built-in OpenNext runtime; no plugin pin.
[build]
  command = "pnpm --filter @gencut/creators-web build"
  # Relative to the base directory (the repository root).
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.28.0"

# Scheduled and background functions. The files here are generated by
# `scripts/bundle-functions.ts` (run by the build) from `functions-src/`: each is
# one self-contained ES module, because Netlify's own packaging does not bundle
# the TypeScript workspace packages the functions import.
[functions]
  directory = "apps/web/netlify/functions"
